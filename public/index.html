<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JergBServer | Status</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0f12;
            color: #e0e6ed;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: #16191e;
            border: 2px solid #2a2f38;
            border-radius: 12px;
            padding: 32px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
        }

        h1 {
            color: #58a6ff;
            font-size: 24px;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(46, 160, 67, 0.15);
            color: #3fb950;
            border: 1px solid rgba(46, 160, 67, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #3fb950;
            border-radius: 50%;
            box-shadow: 0 0 8px #3fb950;
        }

        .info-box {
            background: #0d0f12;
            border: 1px solid #2a2f38;
            border-radius: 6px;
            padding: 16px;
            font-size: 12px;
            color: #8b949e;
            text-align: left;
            line-height: 1.6;
        }

        .info-box strong {
            color: #c9d1d9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>JergBServer</h1>
        <p class="subtitle">Official Multiplayer Node Backend</p>

        <div class="status-badge">
            <span class="dot"></span> Server Online
        </div>

        <div class="info-box">
            <p><strong>Target Target Launch:</strong> August 6, 2026</p>
            <p><strong>Protocol:</strong> WebSockets / Socket.io</p>
            <p><strong>Engine:</strong> JergBuilder WebGL Engine</p>
        </div>
    </div>

</body>
</html>
