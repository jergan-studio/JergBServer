<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JergBServer Status</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0f12;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .dashboard-card {
            background: #16191e;
            border: 2px solid #2a2f38;
            border-radius: 12px;
            padding: 32px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
        }

        h1 {
            color: #58a6ff;
            font-size: 26px;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(46, 160, 67, 0.15);
            color: #3fb950;
            border: 1px solid rgba(46, 160, 67, 0.4);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #3fb950;
            border-radius: 50%;
            box-shadow: 0 0 10px #3fb950;
        }

        .info-grid {
            background: #0d0f12;
            border: 1px solid #2a2f38;
            border-radius: 8px;
            padding: 16px;
            font-size: 13px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            color: #8b949e;
        }

        .info-row strong {
            color: #e0e6ed;
        }

        code {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <h1>JergBServer</h1>
        <p class="subtitle">Official Backend Service for JergBuilder</p>

        <div class="status-badge">
            <span class="status-dot"></span> Server Active
        </div>

        <div class="info-grid">
            <div class="info-row">
                <span>Protocol:</span>
                <strong>WebSockets / Socket.io</strong>
            </div>
            <div class="info-row">
                <span>Default Seed:</span>
                <strong><code>JergBuilder_Default</code></strong>
            </div>
            <div class="info-row">
                <span>World Scale:</span>
                <strong>32x32 Medium Map</strong>
            </div>
            <div class="info-row">
                <span>Player Model:</span>
                <strong><code>jergplr.glb</code></strong>
            </div>
            <div class="info-row">
                <span>Target Launch:</span>
                <strong>August 6, 2026</strong>
            </div>
        </div>
    </div>

</body>
</html>
