<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JergBuilder Server Status</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0d10;
            color: #e0e6ed;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .server-card {
            background: #14181f;
            border: 2px solid #282f3a;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
        }

        h1 {
            color: #58a6ff;
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(46, 160, 67, 0.15);
            color: #3fb950;
            border: 1px solid rgba(46, 160, 67, 0.4);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #3fb950;
            border-radius: 50%;
            box-shadow: 0 0 10px #3fb950;
        }

        .info-grid {
            background: #0b0d10;
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 18px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: left;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label {
            color: #8b949e;
        }

        .value {
            color: #ffffff;
            font-weight: bold;
        }

        .code-tag {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .instructions {
            margin-top: 24px;
            font-size: 12px;
            color: #8b949e;
            line-height: 1.5;
            background: rgba(88, 166, 255, 0.08);
            border: 1px solid rgba(88, 166, 255, 0.2);
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="server-card">
        <h1 id="server-name">JergBuilder Server</h1>
        <p class="subtitle">Official Dedicated Multiplayer Server Template</p>

        <div class="status-badge">
            <span class="dot"></span> Online & Accepting Connections
        </div>

        <div class="info-grid">
            <div class="info-row">
                <span class="label">Players Online:</span>
                <span class="value" id="player-count">-- / --</span>
            </div>
            <div class="info-row">
                <span class="label">World Seed:</span>
                <span class="value"><span class="code-tag" id="server-seed">--</span></span>
            </div>
            <div class="info-row">
                <span class="label">Map Dimensions:</span>
                <span class="value" id="map-size">--</span>
            </div>
            <div class="info-row">
                <span class="label">Networking Protocol:</span>
                <span class="value">Socket.io / WebSockets</span>
            </div>
        </div>

        <div class="instructions">
            Enter this URL into the <strong>JergBuilder Multiplayer Menu</strong> to connect directly to this world!
        </div>
    </div>

    <script>
        // Fetch server stats dynamically from the backend API
        async function fetchServerInfo() {
            try {
                const res = await fetch('/api/info');
                const data = await res.json();
                
                document.getElementById('server-name').innerText = data.name;
                document.getElementById('player-count').innerText = `${data.onlinePlayers} / ${data.maxPlayers}`;
                document.getElementById('server-seed').innerText = data.seed;
                document.getElementById('map-size').innerText = `${data.mapSize} x ${data.mapSize}`;
            } catch (err) {
                console.error("Could not fetch server stats:", err);
            }
        }

        fetchServerInfo();
        setInterval(fetchServerInfo, 5000); // Auto-refresh metrics every 5s
    </script>
</body>
</html>
