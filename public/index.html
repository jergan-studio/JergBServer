<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JergBServer Status</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0c0d10;
            color: #e6edf3;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .server-card {
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 10px;
            padding: 32px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        h1 {
            color: #58a6ff;
            font-size: 26px;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(46, 160, 67, 0.15);
            color: #3fb950;
            border: 1px solid rgba(46, 160, 67, 0.4);
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #3fb950;
            border-radius: 50%;
            box-shadow: 0 0 8px #3fb950;
        }

        .info-box {
            background: #0d1117;
            border: 1px solid #21262d;
            border-radius: 6px;
            padding: 16px;
            font-size: 13px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-label {
            color: #8b949e;
        }

        .info-value {
            color: #f0f6fc;
            font-weight: bold;
        }

        .code-tag {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: inherit;
        }
    </style>
</head>
<body>

    <div class="server-card">
        <h1>JergBServer</h1>
        <p class="subtitle">Official Node.js Backend for JergBuilder</p>

        <div class="status-badge">
            <span class="dot"></span> Online & Listening
        </div>

        <div class="info-box">
            <div class="info-row">
                <span class="info-label">Protocol:</span>
                <span class="info-value">Socket.io / WebSockets</span>
            </div>
            <div class="info-row">
                <span class="info-label">World Seed:</span>
                <span class="info-value"><span class="code-tag">JergBuilder_Default</span></span>
            </div>
            <div class="info-row">
                <span class="info-label">Map Size:</span>
                <span class="info-value">32 x 32 Voxel Mesh</span>
            </div>
            <div class="info-row">
                <span class="info-label">Player Model:</span>
                <span class="info-value"><span class="code-tag">jergplr.glb</span></span>
            </div>
            <div class="info-row">
                <span class="info-label">Target Release:</span>
                <span class="info-value">August 6, 2026</span>
            </div>
        </div>
    </div>

</body>
</html>
