<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JergBServer | Server Browser</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0f12;
            color: #e0e6ed;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #16191e;
            border: 2px solid #2a2f38;
            border-radius: 10px;
            padding: 28px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        h1 {
            color: #58a6ff;
            font-size: 24px;
            text-align: center;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #8b949e;
            font-size: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        .server-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .server-card {
            background: #0d0f12;
            border: 1px solid #2a2f38;
            padding: 14px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .server-info h3 {
            font-size: 15px;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .server-info p {
            font-size: 12px;
            color: #8b949e;
        }

        .badge {
            background: rgba(88, 166, 255, 0.15);
            color: #58a6ff;
            border: 1px solid rgba(88, 166, 255, 0.4);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>JergBServer Browser</h1>
        <p class="subtitle">Live Active Multiplayer Servers</p>

        <div id="server-list" class="server-list">
            <p style="text-align: center; color: #8b949e;">Fetching servers...</p>
        </div>
    </div>

    <script>
        const socket = io();
        const serverListContainer = document.getElementById('server-list');

        socket.on('serverListUpdate', (servers) => {
            serverListContainer.innerHTML = '';
            if (servers.length === 0) {
                serverListContainer.innerHTML = '<p style="text-align: center; color: #8b949e;">No active servers.</p>';
                return;
            }

            servers.forEach(srv => {
                const card = document.createElement('div');
                card.className = 'server-card';
                card.innerHTML = `
                    <div class="server-info">
                        <h3>${srv.name}</h3>
                        <p>Host: ${srv.host}</p>
                    </div>
                    <div class="badge">${srv.playerCount} / ${srv.maxPlayers} Players</div>
                `;
                serverListContainer.appendChild(card);
            });
        });
    </script>
</body>
</html>
